[package]
name = "compile-cuda"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Lower kernel IR terms to CUDA C++ source (ADR-0171 fragment)"
repository = "https://github.com/handl-lang/tool-compile-cuda"
readme = "README.md"
keywords = ["handl", "cuda", "gpu", "compiler"]
categories = ["compilers", "science"]
# Git-install only: https://github.com/handl-lang/tool-compile-cuda (no crates.io).
publish = false

[lib]
name = "compile_cuda"
path = "src/lib.rs"

[[bin]]
name = "compile-cuda"
path = "src/main.rs"

[[bin]]
name = "kernel-lower"
path = "src/bin/kernel-lower.rs"

[dependencies]
# `KernelTerm`/`TritonEmitter` (PL-004 T-094) now live upstream on
# tool-compile-triton main (a01608c), so a git dep resolves — the
# sibling checkout wins via `[patch]`. No tag exists yet; flip to a tag
# pin when one is cut.
compile-triton = { git = "https://github.com/handl-lang/tool-compile-triton", branch = "main" }
serde_json = "1"
base64 = "0.22"
# Desired-state kernel: `CudaEmitter` implements `Emitter<KernelTerm>`
# (PL-004 T-094). Git dep — the sibling checkout wins via `[patch]`.
hnl-tool-codegen = { git = "https://github.com/handl-lang/tool-codegen", branch = "main" }

[dev-dependencies]
serde_json = "1"

# ADR-0128 §Resolution: the sibling checkout wins locally; CI resolves
# the `branch = "main"` git deps.
[patch."https://github.com/handl-lang/tool-codegen"]
hnl-tool-codegen = { path = "../tool-codegen" }

[patch."https://github.com/handl-lang/tool-compile-triton"]
compile-triton = { path = "../tool-compile-triton" }
