[package]
name = "compile-cuda"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Lower kernel IR terms to CUDA C++ source (ADR-0171 fragment)"
repository = "https://github.com/handl-lang/engine-compile-cuda"
readme = "README.md"
keywords = ["handl", "cuda", "gpu", "compiler"]
categories = ["compilers", "science"]
# Git-install only: https://github.com/handl-lang/engine-compile-cuda (no crates.io).
publish = false

[lib]
name = "compile_cuda"
path = "src/lib.rs"

[[bin]]
name = "compile-cuda"
path = "src/main.rs"

[dependencies]
compile-triton = { git = "https://github.com/handl-lang/engine-compile-triton", branch = "main" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
